<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiquezaReal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
    button:hover { background-color: #219150; }
    .assistant-box { background-color: #e8f4f8; border-left: 5px solid #2980b9; padding: 15px; margin-top: 20px; border-radius: 6px; }
    .assistant-title { font-weight: bold; color: #2980b9; margin-bottom: 5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <h1>RiquezaReal</h1>
  
  <form id="finance-form">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" placeholder="Ej. Sueldo, Ahorros, Tarjeta..." required>

    <label for="monto">Monto ($)</label>
    <input type="number" id="monto" step="0.01" placeholder="0.00" required>

    <label for="tipo">Tipo de Movimiento</label>
    <select id="tipo" required>
      <option value="Ingreso">Ingreso</option>
      <option value="Gasto">Gasto</option>
      <option value="Activo">Activo</option>
      <option value="Pasivo">Pasivo</option>
    </select>

    <button type="submit">Guardar Movimiento</button>
  </form>

  <div class="assistant-box">
    <div class="assistant-title">🤖 Asistente Virtual RiquezaReal</div>
    <div id="assistant-message">Bienvenido. Registra un movimiento para recibir un consejo financiero.</div>
  </div>
</div>

<script>
  // Configuración de Supabase
  const SUPABASE_URL = "https://ievwubsmmdeazabdylyi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5pn8_wc1EXvD9cCRZWXOYA_NHhYsQzx"; // Sustituye por tu clave anon/public de Supabase
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('finance-form');
  const assistantMessage = document.getElementById('assistant-message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const descripcion = document.getElementById('descripcion').value;
    const monto = parseFloat(document.getElementById('monto').value);
    const tipo = document.getElementById('tipo').value;

    // Insertar en la tabla 'movimientos'
    const { data, error } = await supabase
      .from('movimientos')
      .insert([{ descripcion, monto, tipo }]);

    if (error) {
      alert("Error al guardar: " + error.message);
      return;
    }

    // Lógica del Asistente Virtual
    if (tipo === "Activo") {
      assistantMessage.innerText = `¡Excelente decisión! Has asignado $${monto} a tus Activos (${descripcion}). Esto generará más ingresos a futuro.`;
    } else if (tipo === "Pasivo") {
      assistantMessage.innerText = `Ojo con tus Pasivos: $${monto} en ${descripcion}. Procura reducirlos para proteger tu flujo de caja.`;
    } else if (tipo === "Ingreso") {
      assistantMessage.innerText = `¡Buen trabajo! Registraste un ingreso de $${monto} (${descripcion}). Recuerda destinar una parte a Activos.`;
    } else {
      assistantMessage.innerText = `Registraste un gasto de $${monto} en ${descripcion}. Revisa si es un gasto prioritario.`;
    }

    form.reset();
  });
</script>

</body>
</html>
