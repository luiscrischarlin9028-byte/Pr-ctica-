<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiquezaReal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 12px; color: #34495e; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 18px; }
    button:hover { background-color: #219150; }
    .assistant-box { background-color: #e8f4f8; border-left: 5px solid #2980b9; padding: 15px; margin-top: 20px; border-radius: 8px; }
    .assistant-title { font-weight: bold; color: #2980b9; margin-bottom: 5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <h1>RiquezaReal 💡</h1>
  <div class="subtitle">Regla Borghino: Págate a ti mismo primero</div>
  
  <form id="finance-form">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" placeholder="Ej. Fondo de Inversión / Cena" required>

    <label for="monto">Monto ($)</label>
    <input type="number" id="monto" step="0.01" placeholder="0.00" required>

    <label for="tipo">Clasificación</label>
    <select id="tipo" required>
      <option value="Activo">🟢 Activo (Inversión/Ahorro)</option>
      <option value="Pasivo">🔴 Pasivo (Deuda/Gasto Fijo)</option>
      <option value="Ingreso">💵 Ingreso</option>
      <option value="Gasto">🛒 Gasto Variable</option>
    </select>

    <button type="submit" id="btn-submit">Registrar Movimiento</button>
  </form>

  <div class="assistant-box">
    <div class="assistant-title">🤖 Asistente Virtual RiquezaReal</div>
    <div id="assistant-message">Bienvenido. Registra un movimiento para recibir tu consejo financiero.</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ievwubsmmdeazabdylyi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5pn8_wc1EXvD9cCRZWXOYA_NHhYsQzx";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('finance-form');
  const assistantMessage = document.getElementById('assistant-message');
  const btnSubmit = document.getElementById('btn-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSubmit.innerText = "Guardando...";
    btnSubmit.disabled = true;

    const descripcion = document.getElementById('descripcion').value;
    const monto = parseFloat(document.getElementById('monto').value);
    const tipo = document.getElementById('tipo').value;

    try {
      const { data, error } = await supabaseClient
        .from('movimientos')
        .insert([{ descripcion, monto, tipo }]);

      if (error) throw error;

      // Respuestas automáticas del Asistente Virtual según la regla financiera
      if (tipo === "Activo") {
        assistantMessage.innerHTML = `👏 <strong>¡Excelente decisión!</strong> Has asignado $${monto.toFixed(2)} a tus Activos (${descripcion}). Esto te acercará a tu libertad financiera.`;
      } else if (tipo === "Pasivo") {
        assistantMessage.innerHTML = `⚠️ <strong>Atención:</strong> Registraste $${monto.toFixed(2)} en Pasivos (${descripcion}). Procura reducir estos compromisos.`;
      } else if (tipo === "Ingreso") {
        assistantMessage.innerHTML = `💵 <strong>¡Buen ingreso!</strong> Recibiste $${monto.toFixed(2)} (${descripcion}). Recuerda destinar un % a Activos antes de gastar.`;
      } else {
        assistantMessage.innerHTML = `📊 Registraste un gasto de $${monto.toFixed(2)} en ${descripcion}. Evalúa si era prioritario.`;
      }

      form.reset();
    } catch (err) {
      alert("Error al conectar con Supabase: " + err.message);
      assistantMessage.innerText = "Hubo un problema al guardar el registro. Intenta de nuevo.";
    } finally {
      btnSubmit.innerText = "Registrar Movimiento";
      btnSubmit.disabled = false;
    }
  });
</script>

</body>
</html>
